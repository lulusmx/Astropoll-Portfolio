# Bloc à ajouter dans la config nginx du container hirondelles-web
# pour proxifier inner.hirondelles.online vers le nouveau container

server {
    listen 80;
    server_name inner.hirondelles.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name inner.hirondelles.online;

    ssl_certificate     /etc/letsencrypt/live/inner.hirondelles.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inner.hirondelles.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass         http://inner-hirondelles:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
